<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1d24"/><stop offset="100%" stop-color="#0f1117"/></linearGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="60%"><stop offset="0%" stop-color="#72c17a" stop-opacity="0.25"/><stop offset="100%" stop-color="#72c17a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#spot)"/>
  <!-- isometric head block -->
  <g transform="translate(200,220)">
    <polygon points="-60,-40 60,-40 60,40 -60,40" fill="#4a7fb5" opacity="0.9"/>
    <polygon points="-60,-40 0,-80 60,-40 0,0" fill="#4a7fb5" filter="brightness(1.2)"/>
    <polygon points="60,-40 60,40 0,0 0,-80" fill="#4a7fb5" filter="brightness(0.8)"/>
    <rect x="-35" y="-25" width="70" height="70" fill="#72c17a" opacity="0.3"/>
  </g>
  <text x="200" y="420" text-anchor="middle" fill="#8b92a5" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Steve — setup</text>
  <text x="200" y="445" text-anchor="middle" fill="#5c6370" font-family="system-ui,sans-serif" font-size="11">HeadCraft</text>
</svg>